name: Product workspace

on:
  pull_request:
    paths:
      - "product/**"
      - "scripts/check-product-security.py"
      - "scripts/check-product-frontend.py"
      - "scripts/release/**"
      - "release/free-supply-chain-policy.json"
      - ".github/workflows/product-ci.yml"
  push:
    branches:
      - main
    paths:
      - "product/**"
      - "scripts/check-product-security.py"
      - "scripts/check-product-frontend.py"
      - "scripts/release/**"
      - "release/free-supply-chain-policy.json"
      - ".github/workflows/product-ci.yml"

permissions:
  contents: read

concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Audit dependency advisories, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: product/Cargo.toml
          command: check
          arguments: --all-features
          command-arguments: advisories licenses sources bans

  rust-gate:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: product
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy,rustfmt

      - name: Reject quarantined privileged prototypes
        working-directory: .
        run: |
          python3 scripts/check-product-security.py
          python3 scripts/check-product-frontend.py

      - name: Test free release-evidence generator
        working-directory: .
        run: |
          python3 scripts/check-free-p7.py
          python3 -m unittest scripts/release/test_generate_release_evidence.py

      - name: Test fail-closed storage identity parser
        run: python3 -m unittest discover -s tools/macos -p 'test_*.py'

      - name: Verify deterministic synthetic corpus
        run: python3 tools/quality/check_fixture_reproducibility.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Test synthetic fixtures
        run: cargo test --workspace --locked

      - name: Lint with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build debug CLI for confined synthetic quality gates
        run: cargo build --locked -p polik-recovery-cli

      - name: Run synthetic recovery quality gates
        run: |
          python3 tools/quality/run_quality_gate.py
          python3 tools/quality/run_fs_quality_gate.py
          python3 tools/quality/run_fragmented_quality_gate.py
          python3 tools/quality/run_apfs_quality_gate.py
          git diff --exit-code -- fixtures

      - name: Verify release CLI fails closed
        run: |
          cargo build --release --locked -p polik-recovery-cli
          python3 tools/quality/check_release_fail_closed.py
