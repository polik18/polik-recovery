[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
  # RUSTSEC-2026-0194 quick-xml: duplicate attribute-name check (Quadratic run time).
  # RUSTSEC-2026-0195 quick-xml: unbounded namespace-declaration allocation in NsReader.
  # Both live in the plist -> tauri-utils -> tauri XML path, not our recovery logic.
  # Fix requires quick-xml >= 0.41.0, but plist 1.8.0 pins ^0.38.0; plist 1.9+ needs Rust 1.88
  # (exceeds our MSRV 1.85.1). Kept on MSRV 1.85 for the P7 free-only release.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # RUSTSEC-2026-0009 time: RFC 2822 stack-exhaustion DoS. Pulled transitively via
  # tauri (cookie) / plist. Only triggered by adversarial RFC 2822 input; ordinary input
  # is unaffected. Fix needs time >= 0.3.47, which tauri 2.11 pins below. Same MSRV trade-off.
  "RUSTSEC-2026-0009",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
# Internal workspace path deps have no version constraint, so cargo-deny flags
# them as wildcards. These are not third-party deps and are safe to skip.
skip = [
  "data_recovery_core",
  "data_recovery_safe_writer",
  "data_recovery_file_carver",
  "data_recovery_fs_ntfs",
  "data_recovery_fs_exfat",
  "data_recovery_fs_fat32",
  "data_recovery_fs_apfs",
  "data_recovery_scan_report",
  "data_recovery_vfs",
  "data_recovery_recovery_plan",
  "data_recovery_device_macos",
  "data_recovery_device_windows",
  "polik-recovery-cli",
  "polik-recovery-desktop",
]
skip-tree = []

[licenses]
confidence-threshold = 0.8
include-dev = true
include-build = true
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
